name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # The impresspress crate's build.rs `include_bytes!`s the impresspress-web
  # wasm (`crates/impresspress-web/pkg/impresspress_web_bg.wasm`) and exits
  # non-zero when it is missing, so no release binary can be built until that
  # wasm exists. Same job as ci.yml's `build-wasm`: build it once, publish
  # `pkg/` as an artifact, and have every matrix target download it.
  build-wasm:
    name: Build impresspress-web wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wasm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Pinned for the same reason as ci.yml: an unpinned lookup can fall
          # back to the action's ancient default, which cannot parse
          # workspace-inherited manifest fields.
          version: 'v0.15.0'

      - name: Build WASM
        run: cd crates/impresspress-web && wasm-pack build --target web --release --out-dir pkg

      - name: Upload pkg/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg/
          retention-days: 1

  build:
    name: Build (${{ matrix.name }})
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: impresspress-linux-amd64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: impresspress-linux-arm64
            ext: tar.gz
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: impresspress-darwin-arm64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: impresspress-darwin-amd64
            ext: tar.gz
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: impresspress-windows-amd64
            ext: zip
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ matrix.name }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install cross-compilation tools (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      # build.rs `include_bytes!`s the impresspress-web wasm; download the
      # prebuilt pkg/ so it finds it (the same step every CI job takes).
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      # `--locked`: a release must resolve exactly the dependency set CI
      # tested, never a fresh resolution of the git pins.
      - name: Build
        run: cargo build --locked -p impresspress --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf /tmp/${{ matrix.name }}.tar.gz impresspress
          echo "ASSET=/tmp/${{ matrix.name }}.tar.gz" >> $GITHUB_ENV

      - name: Package (zip)
        if: matrix.ext == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          zip /tmp/${{ matrix.name }}.zip impresspress.exe
          echo "ASSET=/tmp/${{ matrix.name }}.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          FILES=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          gh release create "$VERSION" $FILES \
            --repo ${{ github.repository }} \
            --title "$VERSION" \
            --generate-notes
