name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'examples/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      # Visual-baseline PNGs live outside crates/. Without this, baseline-only
      # commits (e.g. from regen-visual-baselines.yml) skip CI and the PR
      # shows "no checks" — blocking merge.
      - '.playwright-mcp/**'
      # The dev-sandbox e2e stages this proof guest into a live browser
      # runtime, so a change to it must run CI.
      - 'experiments/browser-service-worker-blocks/guest/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The impresspress crate's build.rs `include_bytes!`s the impresspress-web wasm, so
  # every job that compiles the workspace (check/test/e2e-build) previously ran
  # `wasm-pack build --release` itself — six redundant wasm-opt passes per run.
  # Build it once here, publish `pkg/` as an artifact, and have downstream jobs
  # download it instead of rebuilding.
  build-wasm:
    name: Build impresspress-web wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: wasm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`". Matches gizza-ai's
          # pin (PR #75).
          version: 'v0.15.0'

      - name: Build WASM
        run: cd crates/impresspress-web && wasm-pack build --target web --release --out-dir pkg

      - name: Upload pkg/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg/
          retention-days: 1

  check:
    name: Format & Lint
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint — no full-page html! outside ui/
        run: bash scripts/grep-guard-html.sh

      - name: Lint — WRAP-grant coverage on cross-block db::* callsites
        run: bash scripts/audit-wrap-grants.sh

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: check

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      # clippy compiles impresspress, whose build.rs `include_bytes!`s the
      # impresspress-web wasm. Download the prebuilt pkg/ so build.rs finds it.
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      - name: Run clippy
        run: cargo clippy --locked --workspace --exclude impresspress-web --exclude impresspress-cloudflare

      # `block-dev` is deliberately absent from `default` (the dev sandbox's
      # control plane must not exist in a normal bundle), so the workspace
      # clippy above compiles none of it — not the block, and not the ~4 200
      # lines of `#![cfg(feature = "block-dev")]` integration tests that pin
      # its rules. `--all-targets` is what reaches those, and `test-support`
      # is what lets them link `FakeControl`.
      - name: Clippy (block-dev)
        run: cargo clippy --locked -p impresspress-core --features block-dev,test-support --all-targets -- -D warnings

  test:
    name: Tests
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test

      # The impresspress crate's build.rs `include_bytes!`s the impresspress-web wasm;
      # without it `cargo test --workspace` fails before any test runs.
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      # Auth tests (tests/auth, tests/auth_http) run against in-memory
      # SQLite only. A dual-backend matrix (sqlite + postgres) for the
      # `wafer_run__auth__*` tables is deferred until a postgres-backed
      # test context lands in wafer-block-postgres — Plan A did not wire
      # one, and Plans B + C reuse the same MigrationTestCtx shape so
      # the deferral still stands. In particular the partial unique
      # index `orgs(verified_via, verified_ref) WHERE NOT is_reserved`
      # introduced by migration 002 needs a postgres variant before it
      # can be exercised in a real dual-backend CI matrix — extending
      # the harness is the right root-cause fix rather than bolting a
      # separate job on here.
      - name: Run tests
        run: cargo test --locked --workspace --exclude impresspress-web --exclude impresspress-cloudflare

      # The other half of the `block-dev` gap: `--workspace` above skips every
      # `dev_*.rs` integration test, because all five are `#![cfg]`-gated on a
      # feature nothing turns on. `wasm` is load-bearing rather than
      # incidental — `tests/lockfile_e2e.rs` needs wafer-run built with wasmi,
      # and `-p impresspress-core --features block-dev` alone leaves it red.
      - name: Run the block-dev suite
        run: cargo test --locked -p impresspress-core --features block-dev,wasm

      # `dev.js` is a TAIL composed into an IIFE with nothing on `window`
      # (see the file's own header comment), so its internal logic has no
      # exported function the Rust suite above can call directly —
      # `test/harness.mjs` reads the same source `dev_js()` composes and
      # wraps it itself to reach the internal state. Pins the I1 fix (an
      # abort mid-flight must not drive the poll count negative or leave
      # `setInterval` running forever) and the M3 fix (a 409 with no
      # `current_sha256` is a quota refusal, not a hash conflict).
      - name: Run dev.js unit tests (node --test)
        run: node --test crates/impresspress-core/src/blocks/dev/assets/test/*.test.mjs

      # `webmcp.js` is the same shape (a tail composed by
      # `ui/assets.rs::compose_webmcp_script`) and its own harness composes it
      # the same way. What these pin is WHEN it fetches the manifest: before
      # the service worker controls the page that fetch misses the wasm
      # router, and behind SPA fallback the network answers `index.html` with
      # 200 — a silent zero-tool page. `e2e-smoke` covers the same property
      # end to end, but only in the one browser arrangement it can stage;
      # these cover the arrangements it cannot (a native server with no
      # registration at all, a claim that never comes).
      - name: Run webmcp.js unit tests (node --test)
        run: node --test crates/impresspress-core/src/ui/assets/test/*.test.mjs

  # Every `#[cfg(feature = "postgres")]` assertion in the repo — the seven
  # migration tests that check each block's `*.postgres.sql` twin is the one
  # its Rust list actually references — was dead code in CI: nothing anywhere
  # ran `cargo test` with that feature on. `products-postgres` below does not
  # cover them; it globs the `.sql` files through `psql`, which proves the SQL
  # parses and runs but says nothing about whether any Rust constant points at
  # it. A migration wired into `SQLITE_MIGRATIONS` and forgotten in
  # `POSTGRES_MIGRATIONS` compiled clean and failed no test.
  #
  # No Postgres service container: the `postgres` feature is a pure cfg flag on
  # impresspress-core (`postgres = []`), and on impresspress-native it only
  # pulls `wafer-block-postgres` in as a dependency. Nothing under it opens a
  # connection at test time — the assertions are all against embedded SQL text.
  # `products-postgres` is where a real server belongs, and it has one.
  #
  # impresspress-native is built alongside impresspress-core because it holds
  # the only non-test postgres-gated Rust (`make_postgres_database_service`),
  # which nothing else in CI compiles. Neither crate has a build.rs, so this
  # job needs no `build-wasm` artifact and does not depend on that job.
  test-postgres:
    name: Tests (postgres feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test-postgres

      # `package/feature` spelling because `--features` needs it whenever more
      # than one package is selected.
      - name: Run tests with the postgres feature
        run: cargo test --locked -p impresspress-core -p impresspress-native --features impresspress-core/postgres,impresspress-native/postgres

  cloudflare:
    name: Cloudflare wasm32 check
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cloudflare

      # build.rs prereq for any impresspress crate pulled into the cloudflare build.
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      # impresspress-cloudflare is wasm-only (cdylib targeting CF Workers).
      # Excluded from host `cargo test`/`clippy` because its R2/D1 services
      # wrap `!Send` JsFutures that violate wafer-core's Send-bound traits
      # on host. Verify the crate compiles for wasm32 here.
      - name: Check impresspress-cloudflare (wasm32)
        run: cargo check --locked -p impresspress-cloudflare --target wasm32-unknown-unknown

      # `--tests` is what pulls the crate's `#[wasm_bindgen_test]` modules into
      # the type check — the plain check above does not compile `#[cfg(test)]`
      # code at all, so a signature break in the runtime-cache / KV-cache
      # regression tests sat invisible. Same reasoning (and same fix) as the
      # `Check impresspress-browser conformance wiring` step below; kept
      # separate from the `cloudflare-wasm-test` job so it runs unconditionally
      # even when that job's path filter skips.
      - name: Check impresspress-cloudflare tests (wasm32)
        run: cargo check --locked --tests -p impresspress-cloudflare --target wasm32-unknown-unknown

      # Compile-time DatabaseService conformance assertions (wafer-run #319
      # shared suite) for the D1 + KV-cached adapters. Off-by-default feature so
      # the ~1.3k-line suite never enters the production Worker wasm; this step
      # enforces that both adapters still satisfy the suite's trait surface.
      - name: Check impresspress-cloudflare conformance wiring (wasm32)
        run: cargo check --locked -p impresspress-cloudflare --features conformance-check --target wasm32-unknown-unknown

      # Browser-target crates are also wasm-only consumers of wafer-run, and
      # nothing else in CI builds them for wasm32 — a set_asset_loader
      # signature break sat silently red on main for 5 days before the
      # impresspress #253 review caught it.
      - name: Check impresspress-browser + minimal-browser (wasm32)
        run: cargo check --locked -p impresspress-browser -p minimal-browser --target wasm32-unknown-unknown

      # Compile the browser adapter's shared DatabaseService conformance
      # assertion (wafer-run #319). It lives in a `#[cfg(all(test,
      # target_arch = "wasm32"))]` module, so `--tests` is required to pull the
      # wasm32 dev-dep `conformance` feature and typecheck it — the plain check
      # above (no `--tests`) does not compile it. Unconditional here on purpose:
      # the dedicated `browser-wasm-test` job below is path-filtered to
      # crates/impresspress-browser/, so a wafer-run pin bump — the exact
      # trait-surface drift this guards — would skip it.
      - name: Check impresspress-browser conformance wiring (wasm32)
        run: cargo check --locked --tests -p impresspress-browser --target wasm32-unknown-unknown

  # impresspress-browser's `#[wasm_bindgen_test]`s (storage.rs, bridge.rs,
  # network.rs — the wasm32-only-gated modules) previously only got
  # `cargo check --target wasm32-unknown-unknown`'d by the `cloudflare` job
  # above — compiled, never executed. They're pure JsValue-shape unit tests
  # (build/decode plain JS objects via js-sys — no OPFS, no real fetch, no
  # DOM) so they run headlessly under Node via `wasm-pack test --node`; no
  # browser install needed. Independent of the impresspress-web wasm build
  # (build.rs's include_bytes! prereq only matters for the `impresspress`
  # crate), so this job doesn't need `build-wasm`'s artifact.
  # impresspress-cloudflare's `#[wasm_bindgen_test]`s (runtime_cache.rs's
  # probe/backoff/plan-trust policy and kv_cached_db.rs's row-cache
  # write-suppression) were compiled by nothing and run by nothing: the crate
  # is excluded from the host `cargo test` above, and the wasm `cargo check`
  # skipped `#[cfg(test)]` entirely. That is how the KV error-as-miss defect
  # (2026-08-30/31 read exhaustion -> multi-thousand write bursts) reached
  # production with a green pipeline.
  #
  # `wasm-pack test --node` does NOT work here — the crate is a cdylib and
  # wasm-pack collects 0 tests from it — so this drives the same
  # wasm-bindgen-test-runner directly through cargo. The runner is part of
  # wasm-bindgen-cli and its version must match the `wasm-bindgen` crate
  # (0.2.122, pinned in Cargo.lock) or it refuses to run the module.
  # These are pure-logic tests (in-memory KV/DB doubles, no worker::Env, no
  # real fetch), so Node is enough; no browser install needed.
  cloudflare-wasm-test:
    name: Cloudflare WASM tests (impresspress-cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for impresspress-cloudflare changes
        id: cloudflare-changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- crates/impresspress-cloudflare/)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.cloudflare-changes.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        if: steps.cloudflare-changes.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-test-runner
        if: steps.cloudflare-changes.outputs.skip != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Run impresspress-cloudflare wasm tests (Node)
        if: steps.cloudflare-changes.outputs.skip != 'true'
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p impresspress-cloudflare --target wasm32-unknown-unknown --lib

  browser-wasm-test:
    name: Browser WASM tests (impresspress-browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate like the `sdk` job below: skip the (slower, wasm-target) build
      # entirely on PRs that don't touch impresspress-browser.
      - name: Check for impresspress-browser changes
        id: browser-changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- crates/impresspress-browser/)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.browser-changes.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        if: steps.browser-changes.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: browser-wasm-test

      - name: Install wasm-pack
        if: steps.browser-changes.outputs.skip != 'true'
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          version: 'v0.15.0'

      - name: Run storage_paths.mjs unit tests (node --test)
        if: steps.browser-changes.outputs.skip != 'true'
        run: node --import ./crates/impresspress-browser/js/test/node-hooks.mjs --test crates/impresspress-browser/js/test/storage_paths.test.mjs

      - name: Run impresspress-browser wasm tests (Node)
        if: steps.browser-changes.outputs.skip != 'true'
        run: wasm-pack test --node crates/impresspress-browser

  # E2E is split into a single build stage plus two independent test stages so
  # the browser-WASM smoke tests (port 8080) and the native-server visual
  # baselines (port 8093) run in parallel instead of end-to-end in one job.
  e2e-build:
    name: E2E build (CLI + web assets)
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: e2e

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`". Matches gizza-ai's
          # pin (PR #75).
          version: 'v0.15.0'

      # build.rs prereq: the impresspress build.rs `include_bytes!`s this wasm.
      # Download the shared artifact instead of rebuilding it here.
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      # Debug build (not `--release`): the visual-baseline server serves
      # server-rendered HTML and the smoke flow is browser-WASM, so the native
      # binary's runtime speed is irrelevant — a debug compile is far cheaper.
      # `--root out` lands the binary at out/bin/impresspress for artifact upload.
      - name: Install impresspress CLI (debug)
        run: cargo install --path crates/impresspress --locked --debug --root "$GITHUB_WORKSPACE/out"

      - name: Put impresspress on PATH
        run: echo "$GITHUB_WORKSPACE/out/bin" >> "$GITHUB_PATH"

      # Embed × web flow (Cargo.toml + impresspress.toml present): the unified
      # CLI runs wasm-pack, then `impresspress_bundle::bundle::run` to drop
      # sw.js / loader.js / index.html / hashed assets into pkg/. This produces
      # the served bundle for the smoke tests, overwriting the prereq pkg/.
      - name: Build impresspress-web (framework assets + hashed pkg/)
        working-directory: crates/impresspress-web
        run: impresspress build --target web --release

      - name: Upload bundled web dist
        uses: actions/upload-artifact@v4
        with:
          name: impresspress-web-dist
          path: crates/impresspress-web/pkg/
          retention-days: 1

      - name: Upload impresspress binary
        uses: actions/upload-artifact@v4
        with:
          name: impresspress-bin
          path: out/bin/impresspress
          retention-days: 1

  e2e-smoke:
    name: E2E smoke (browser WASM)
    needs: e2e-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundled web dist
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-dist
          path: crates/impresspress-web/pkg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/impresspress-web/package-lock.json') }}

      - name: Install Playwright
        working-directory: crates/impresspress-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Serve pkg/ in background (smoke tests)
        working-directory: crates/impresspress-web
        run: |
          python3 -m http.server 8080 -d pkg &
          echo $! > /tmp/http-pid
          # Wait for server to accept connections
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/sw.js > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Run smoke tests (browser WASM, port 8080)
        working-directory: crates/impresspress-web
        run: npx playwright test --config=tests/playwright.config.ts tests/e2e/smoke.spec.ts

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/http-pid ]; then
            kill "$(cat /tmp/http-pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: crates/impresspress-web/playwright-report/
          retention-days: 7

  # The only job that compiles, boots and exercises the browser development
  # sandbox. `impresspress-web/src/dev_runtime.rs` — wasmi `inspect`/`probe`,
  # the runtime rebuild, `replace_wafer`, boot convergence, seed-on-boot —
  # exists only inside a service worker, so no host test can run a line of it;
  # this job is where it runs. It is also the only place the `browser-devtools`
  # feature set is compiled at all — `block-dev` itself is covered by the
  # `Clippy (block-dev)` and `Run the block-dev suite` steps above, which lint
  # and run `impresspress-core`'s half on the host.
  e2e-dev-sandbox:
    name: E2E dev sandbox (browser WASM + wasmi guest)
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wafer-run
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-unknown-unknown builds the `browser-devtools` bundle;
          # wasm32-wasip1 builds the proof guest the e2e stages over HTTP.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: e2e-dev

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Pinned for the same reason as `build-wasm` — see the note there.
          version: 'v0.15.0'

      # build.rs prereq: the impresspress crate `include_bytes!`s pkg/. What the
      # tests actually serve is built from `pkg-dev/` (the feature-on wasm),
      # substituted through IMPRESSPRESS_WEB_WASM / IMPRESSPRESS_WEB_JS by the
      # sealed web flow — but the CLI does not compile without pkg/ present.
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      # The only `--features browser-devtools` gate in CI. `--no-deps` scopes it
      # to this crate: the un-scoped command is red on six pre-existing
      # impresspress-core warnings in other features' code.
      - name: Clippy (browser-devtools, wasm32)
        run: cargo clippy -p impresspress-web --target wasm32-unknown-unknown --features browser-devtools --no-deps -- -D warnings

      # Debug build, as `e2e-build` does: the CLI only assembles static files
      # here, so its runtime speed is irrelevant and a debug compile is cheaper.
      - name: Install impresspress CLI (debug)
        run: cargo install --path crates/impresspress --locked --debug --root "$GITHUB_WORKSPACE/out"

      - name: Put impresspress on PATH
        run: echo "$GITHUB_WORKSPACE/out/bin" >> "$GITHUB_PATH"

      - name: Build the proof guest (wasm32-wasip1)
        run: cargo build --release --target wasm32-wasip1 --manifest-path experiments/browser-service-worker-blocks/guest/Cargo.toml

      # `--check` fails fast on a seed/manifest.json that has drifted from
      # seed/site/** — the same check `build.sh`'s normal path runs before it
      # builds anything, surfaced as its own step so a stale manifest is
      # reported without paying for a wasm-pack build first.
      - name: Check the dev-sandbox seed manifest
        run: examples/dev-sandbox/build.sh --check

      # One script, shared with local runs: wasm-pack with `browser-devtools`,
      # then the sealed web flow with `[dev] enabled = true` and the welcome
      # seed overlaid onto `dist/seed/`. Its last stdout line is the dist path.
      - name: Build the dev-sandbox bundle
        run: |
          DIST="$(examples/dev-sandbox/build.sh | tail -1)"
          echo "DEV_DIST=$DIST" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/impresspress-web/package-lock.json') }}

      - name: Install Playwright
        working-directory: crates/impresspress-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Serve the dev bundle in background (port 8082)
        run: |
          python3 -m http.server 8082 -d "$DEV_DIST" &
          echo $! > /tmp/dev-http-pid
          # Wait for the server to accept connections, then prove both halves
          # of the bundle are actually there: the worker, and the seed the
          # first boot imports.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8082/sw.js > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8082/seed/manifest.json > /dev/null

      - name: Run dev sandbox e2e (browser WASM, port 8082)
        working-directory: crates/impresspress-web
        env:
          TEST_PORT: 8082
          PROOF_GUEST_WASM: ${{ github.workspace }}/experiments/browser-service-worker-blocks/guest/target/wasm32-wasip1/release/browser_compiled_wafer_block.wasm
        run: npx playwright test --config=tests/playwright.config.ts tests/e2e/dev-foundations.spec.ts tests/e2e/dev-workspace.spec.ts

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/dev-http-pid ]; then
            kill "$(cat /tmp/dev-http-pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dev-sandbox
          path: crates/impresspress-web/playwright-report/
          retention-days: 7

  e2e-visual:
    name: E2E visual baselines (native server)
    needs: e2e-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download impresspress binary
        uses: actions/download-artifact@v4
        with:
          name: impresspress-bin
          path: out/bin

      - name: Put impresspress on PATH
        run: |
          chmod +x "$GITHUB_WORKSPACE/out/bin/impresspress"
          echo "$GITHUB_WORKSPACE/out/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/impresspress-web/package-lock.json') }}

      - name: Install Playwright
        working-directory: crates/impresspress-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start native impresspress server in background (visual-baseline tests)
        run: |
          # Run from /tmp so impresspress auto-detects "sealed" mode (no
          # ancestor Cargo.toml). Running from inside the repo triggers
          # embed_native flow which `cargo build`s the whole workspace
          # before the server starts, busting the wait loop.
          cd /tmp
          IMPRESSPRESS_LISTEN="127.0.0.1:8093" \
          IMPRESSPRESS_DB_PATH="/tmp/impresspress-visual-baseline.db" \
          WAFER_RUN_SHARED__AUTH__BOOTSTRAP_ADMIN_EMAIL="admin@example.com" \
          WAFER_RUN_SHARED__AUTH__BOOTSTRAP_ADMIN_PASSWORD="admin123" \
          IMPRESSPRESS_BLOCK_ENABLED="impresspress/userportal,impresspress/vector" \
            impresspress > /tmp/impresspress-baseline.log 2>&1 &
          echo $! > /tmp/impresspress-pid
          # Wait for native server to accept connections (60s; sealed-mode
          # boot is fast — SQLite seed + WAFER init only).
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8093/b/auth/login -o /dev/null; then
              echo "server ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Fail fast if server never came up (don't hand a dead port to playwright).
          if ! curl -sf http://127.0.0.1:8093/b/auth/login -o /dev/null; then
            echo "::error::native impresspress did not start within 60s"
            tail -50 /tmp/impresspress-baseline.log
            exit 1
          fi

      # webmcp.spec.ts runs AFTER the visual baselines: it seeds a product into
      # the same database, and a product that exists before the admin pages are
      # screenshotted would show up in them.
      - name: Run visual-baseline and WebMCP end-to-end tests (native server, port 8093)
        working-directory: crates/impresspress-web
        env:
          TEST_PORT: 8093
        run: npx playwright test --config=tests/playwright.visual-baseline.config.ts tests/e2e/visual-baseline.spec.ts tests/e2e/webmcp.spec.ts

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/impresspress-pid ]; then
            kill "$(cat /tmp/impresspress-pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: crates/impresspress-web/playwright-report/
          retention-days: 7

  products-browser:
    name: Products browser lifecycles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/impresspress-web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: products-playwright-${{ runner.os }}-${{ hashFiles('crates/impresspress-web/package-lock.json') }}

      - name: Install browser-test dependencies and Chromium
        working-directory: crates/impresspress-web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Products admin, buyer, seller, Stripe, and lifecycle flows
        working-directory: crates/impresspress-web
        run: npx playwright test --config=tests/playwright.config.ts tests/e2e/products-*.spec.ts

      - name: Upload Products browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-products
          path: |
            crates/impresspress-web/playwright-report/
            crates/impresspress-web/test-results/
          retention-days: 7

  product-examples:
    name: Products static examples (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: product-examples-playwright-${{ runner.os }}-${{ hashFiles('examples/package-lock.json') }}

      - name: Install example dependencies and Chromium
        working-directory: examples
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run ten-site commerce suite
        working-directory: examples
        env:
          PRODUCT_EXAMPLES_PORT: 4178
        run: npm run test:products

      - name: Upload product-example report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-product-examples
          path: |
            examples/playwright-report-products/
            examples/test-results/
          retention-days: 7

  products-postgres:
    name: Products PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: impresspress_products_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d impresspress_products_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: impresspress_products_test
    steps:
      - uses: actions/checkout@v4

      - name: Apply all Products PostgreSQL migrations in order
        run: |
          for migration in crates/impresspress-core/src/blocks/products/migrations/*.postgres.sql; do
            echo "applying ${migration}"
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done

      - name: Verify commerce schema and deterministic templates
        run: |
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'impresspress__products__%'")" -ge 20
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM impresspress__products__product_templates WHERE id IN ('simple_product','simple_subscription','configurable_product','configurable_subscription')")" -eq 4
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_name = 'impresspress__products__purchases' AND column_name IN ('shipping_cents','subscription_event_created','provider_payment_status','payment_intent_event_created')")" -eq 4
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE (table_name, column_name) IN (('impresspress__products__refunds','stripe_event_created'),('impresspress__products__seller_accounts','stripe_event_created'),('impresspress__products__provider_operations','processing_owner'))")" -eq 3

      # 020 repairs historical `deleted_at = ''` rows. Those rows sit OUTSIDE
      # 005's partial unique slug index (`slug <> '' AND deleted_at IS NULL`),
      # so while one existed another product was free to take its slug —
      # and the repair pulls it back into the index against that slug. A
      # unique violation there aborts the whole migration (only a duplicate
      # ADD COLUMN is tolerated), leaving the hash unstamped so every later
      # boot re-runs and re-fails; on Cloudflare that is a 500 per request.
      # `slug_collision_cannot_fail_020` pins the guard on SQLite — this pins
      # the same behaviour on real PostgreSQL. 020 already ran above against
      # an empty table and is re-runnable.
      - name: Migration 020 tolerates a slug collision
        run: |
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__products__products (id, name, slug, deleted_at, created_at, updated_at) VALUES ('blank_jacket', 'bj', 'jacket', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('live_jacket', 'lj', 'jacket', NULL, '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_hat_a', 'ba', 'hat', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_hat_b', 'bb', 'hat', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_scarf', 'bs', 'scarf', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_noslug', 'bn', '', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('live_noslug', 'ln', '', NULL, '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')"
          psql --set ON_ERROR_STOP=1 --file crates/impresspress-core/src/blocks/products/migrations/020_normalize_blank_deleted_at.postgres.sql
          test "$(psql --tuples-only --no-align --command "SELECT string_agg(id, ',' ORDER BY id) FROM impresspress__products__products WHERE deleted_at IS NULL")" = "blank_noslug,blank_scarf,live_jacket,live_noslug"
          test "$(psql --tuples-only --no-align --command "SELECT string_agg(id, ',' ORDER BY id) FROM impresspress__products__products WHERE deleted_at = ''")" = "blank_hat_a,blank_hat_b,blank_jacket"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ignore entries in .cargo/audit.toml carry `expiry=YYYY-MM-DD`
      # markers so temporary exceptions get re-triaged instead of living
      # there forever. Fails the job if any marker's date has passed.
      - name: Check for expired cargo-audit exceptions
        run: bash scripts/check-audit-expiry.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      # Blocking: a new, un-reviewed advisory fails CI. Known-acceptable
      # exceptions (with owner + expiry) live in .cargo/audit.toml — see
      # that file for the review/renewal process.
      - name: Run audit
        run: cargo audit

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for SDK changes
        id: sdk-changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- packages/impresspress-js/)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sdk-changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout wafer-run (for local dependency)
        if: steps.sdk-changes.outputs.skip != 'true'
        run: git clone --depth 1 https://github.com/wafer-run/wafer-run.git "$GITHUB_WORKSPACE/../wafer-run"

      - name: "Build wafer-client-js (file: dep needs dist for tsc)"
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: ../wafer-run/packages/wafer-client-js
        run: |
          npm ci
          npm run build

      - name: Install and build SDK
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Test SDK
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: npm test

      - name: Smoke-test clean pack/install
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: npm run test:pack-install
